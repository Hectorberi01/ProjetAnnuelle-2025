name: CI & CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dir: api-gateway      # dossier service
            image: gateway        # nom image
          - dir: auth-service
            image: auth-service
          - dir: project-service
            image: project-service
          - dir: user-service
            image: user-service
          - dir: group-service
            image: group-service
          - dir: grade-service
            image: grade-service
          - dir: report-service
            image: report-service
          - dir: promotion-service
            image: promotion-service
          - dir: livrable-service
            image: livrable-service
          - dir: soutenance-service
            image: soutenance-service
          - dir: notation-service
            image: notation-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install & tests
        working-directory: ${{ matrix.dir }}
        run: |
          npm ci
          npm run test --if-present

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.dir }}
          push: true
          tags: |
            ghcr.io/victoire-s/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/victoire-s/${{ matrix.image }}:${{ github.ref_name }}

  deploy-prod:
    needs: build-test-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            export TAG=main
            cd /opt/projetannuelle     # dossier du repo cloné sur la VM
            git pull
            docker compose -f compose.prod.yml pull
            docker compose -f compose.prod.yml up -d --remove-orphans
